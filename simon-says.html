<!DOCTYPE html>
<html lang="en" ng-app="simonApp">
<head>
  <meta charset="UTF-8">
  <title>Simon Says</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f2f2;
      margin-top: 40px;
    }

    h1 {
      margin-bottom: 5px;
    }

    #status {
      margin-bottom: 20px;
      font-size: 18px;
    }

    #board {
      width: 260px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-gap: 10px;
    }

    .pad {
      height: 120px;
      border: 2px solid #333;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0.5; 
    }


    .pad.active {
      opacity: 1;
    }

    .green  { background-color: green; }
    .red    { background-color: red; }
    .yellow { background-color: gold; }
    .blue   { background-color: blue; }

    #controls {
      margin-top: 20px;
    }

    button.control {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body ng-controller="SimonController">

  <h1>Simon Says</h1>

  <div id="status">
    Score: {{ score }}
    <span ng-if="message"> - {{ message }}</span>
  </div>

  <div id="board">
    <div class="pad {{ color }}"
         ng-repeat="color in colors"
         ng-class="{ active: litColor === color }"
         ng-click="playerClicked(color)">
    </div>
  </div>

  <div id="controls">
    <button class="control" ng-click="startGame()" ng-disabled="isPlaying">
      Start Game
    </button>
  </div>

  <script>
    var simonApp = angular.module('simonApp', []);

    simonApp.controller('SimonController', function ($scope, $timeout) {

      $scope.colors = ['green', 'red', 'yellow', 'blue'];
      $scope.sequence = [];       
      $scope.playerStep = 0;      
      $scope.score = 0;
      $scope.isPlaying = false;   
      $scope.litColor = null;     
      $scope.message = 'Press Start Game to begin';

      $scope.startGame = function () {
        $scope.sequence = [];
        $scope.score = 0;
        $scope.message = '';
        $scope.nextRound();
      };

      $scope.nextRound = function () {
        $scope.playerStep = 0;
        $scope.isPlaying = true;
        $scope.message = 'Watch the pattern...';

        var randomColor = $scope.colors[Math.floor(Math.random() * $scope.colors.length)];
        $scope.sequence.push(randomColor);

        $scope.playSequence();
      };

      $scope.playSequence = function () {
        var i = 0;

        function showNext() {
          if (i < $scope.sequence.length) {
            $scope.litColor = $scope.sequence[i];


            $timeout(function () {
              $scope.litColor = null;
            }, 400);

            i++;

            $timeout(showNext, 800);
          } else {

            $scope.message = 'Your turn!';
          }
        }

        showNext();
      };

      $scope.playerClicked = function (color) {
        if (!$scope.isPlaying || $scope.message === 'Watch the pattern...') {
          return;
        }

        $scope.litColor = color;
        $timeout(function () {
          $scope.litColor = null;
        }, 200);

        var expectedColor = $scope.sequence[$scope.playerStep];

        if (color === expectedColor) {
          $scope.playerStep++;

          if ($scope.playerStep === $scope.sequence.length) {
            $scope.score++;
            $scope.message = 'Correct! Get ready for the next round...';
            $scope.isPlaying = false;

            $timeout(function () {
              $scope.nextRound();
            }, 1000);
          }
        } else {
          $scope.message = 'Wrong! Game over. Final score: ' + $scope.score;
          $scope.isPlaying = false;
        }
      };

    });
  </script>

</body>
</html>
